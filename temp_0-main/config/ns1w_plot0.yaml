default: &DEFAULT

  #General
  # For computing compression
  n_params_baseline: None
  verbose: True
  # arch: 'tfno2d'
  arch: fno


  #Distributed computing
  distributed:
    use_distributed: 0 #False in darcy
    wireup_info: 'mpi'
    wireup_store: 'tcp'
    model_parallel_size: 1 #2
    seed: 666

  # FNO related
  fno:
    model_arch: fno
    n_modes: [8,48,48] #for t,x
    data_channels: 4 # 1+3 (PE)  #will be determined by pde-onfo, see config_arch in main_code #1(pde)+1(dim:postion)  (i.e. in_channels, but should use the name data_ here (model_dispatcher L55))
    out_channels: 1
    lifting_channel_ratio: 9.1428571429
    projection_channel_ratio: 2.286
    positional_embedding: None

    hidden_channels: 28
    projection_channels: 64 # hidden channel in lifting layer: 256
    n_layers: 4
    domain_padding: [0.125,0,0] #None #0.078125 #None
    domain_padding_mode: 'one-sided' #symmetric
    fft_norm: 'forward'
    norm: 'group_norm'
    skip: 'linear'
    implementation: 'factorized'
    separable: 0
    preactivation: 0
    
    use_mlp: 1
    mlp:
        expansion: 0.5
        dropout: 0

    factorization: None #'cp' if use factoriz #None
    rank: 1.0 #1.0
    fixed_rank_modes: None
    dropout: 0.0
    tensor_lasso_penalty: 0.0
    joint_factorization: False
    fno_block_precision: 'full' # or 'half', 'mixed'
    stabilizer: None # or 'tanh'


  # Dataset related
  data:
    t_predict: 0.5  #phy time
    
    dsp: 1 #downsample factor for data
    
    positional_encoding: True
    encode_input: False
    encode_output: False

    repeat_ini: 32
  
  # Patching
  patching:
    levels: 0
    padding: 0
    stitching: False

  # Weights and biases
  wandb:
    log: False
    name: None # If None, config will be used but you can override it here
    group: '' 
    project: "temp_1006"
    entity: "wcwcal" # put your username here
    sweep: False
    log_output: True
    log_test_interval: 1
    pde: kf #ks/kf/
    pino: 1    
    use_check_pt: 1 #True
    