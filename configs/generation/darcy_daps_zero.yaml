outdir: 'exps'
name: ''

# Dataset options
task: 'inverse'  # forward, inverse, or forward_inverse
dataset: 'darcy'
data_path: 'data/DiffPDE/darcy_test_hf'
data_offset: null
resolution: 128  # downsampled resolution, defaults to dataset resolution
max_size: null  # maximum number of samples to use, defaults to one epoch
batch_size: 32

# Model options
pkl_path: '__required__'
rbf_scale: 0.05

# Generation options
seed: null
init_latents: "rbf"  # rbf or white_noise
iterations: 40

# Loss options
observation: 
  - type: "sparse"
    loss_type: "mse"  # mse, l1, l2, or huber
    known_indices: [500, 500]
    normalize: true

# Guidance options
guidance:
  type: "daps_zero"
  annealing:
    num_steps: 40
    sigma_max: 50
    sigma_min: 0.01
    sigma_final: 0
    rho: 7
  diffusion:
    num_steps: 5
    sigma_min: 0.001
    sigma_final: 0
    rho: 7
  langevin:
    num_steps: 5
    lr: 1.0e-3
    lr_min_ratio: 0.01
    tau: 0.001  # the inverse of observation importance
    weights: [10, 0]

# I/O-related
n_plots: 4  # number of samples to plot
n_process_steps: 10  # number of steps to plot process
wandb: "offline"
