outdir: 'exps'
name: ''

# Dataset options
task: 'inverse'  # forward, inverse, or forward_inverse
dataset: 'poisson'
data_path: 'data/DiffPDE/poisson_test_hf'
data_offset: null
resolution: 128  # downsampled resolution, defaults to dataset resolution
max_size: 12  # maximum number of samples to use, defaults to one epoch
batch_size: 12

# Model options
pkl_path: '__required__'
rbf_scale: 0.05

# Generation options
seed: 1999870123 # 1925618564 #1568312476
init_latents: "rbf"  # rbf or white_noise
iterations: 500
sigma_min: 0.002
sigma_max: 80
rho: 7

# Loss options
observation: 
  - type: "sparse"
    loss_type: "l1"  # mse, l1, l2, huber, or sobolev_h1
    known_indices: [500, 500]
    normalize: true
  # - type: "pde"
  #   loss_type: "huber"
  #   derivative_method: "finite_diff"
  # - type: "fno"
  #   loss_type: "mse"
  #   normalize: true

# Guidance options
guidance:
  type: "dps"
  surrogate_type: "fno_pad" # fno, fno_pad, uno
  weights: [0, 10000, 0, 0] # Default guidance = 10000
  # Super-resolution guidance
  sigma_min_1: 0.005
  sigma_max_2: 5
  init_resolution: 64
  upsampling_mode: "bilinear"
  upsampling_step: 200
